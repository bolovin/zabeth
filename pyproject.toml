[project]
name = "zabeth"
version = "0.1.0"
description = "grandmaman"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"

[tool.poetry]
packages = [{ include = "zabeth", from = "src" }]

[tool.poetry.dependencies]
myst = "^1.0.4"
jupyter-book = {extras = ["markdownincludes"], version = "^1.0.4.post1"}
sphinx-book-theme = "^1.1.4"
pillow = "^11.1.0"
piexif = "^1.1.3"
imagehash = "^4.3.2"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
